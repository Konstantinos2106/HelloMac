<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konstantinos Radio - Live</title>
<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#ff5f6d;
    --accent2:#ffc371;
    --text:#f5f5f7;
    --muted:#b8b8c8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%;
    animation:gradientShift 18s ease infinite;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--text);
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .player-card{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:24px;
    padding:36px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    text-align:center;
  }
  .logo-ring{
    width:140px;
    height:140px;
    margin:0 auto 20px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent));
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .logo-ring.playing{
    animation:spin 6s linear infinite;
  }
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .logo-inner{
    width:112px;
    height:112px;
    border-radius:50%;
    background:var(--bg3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
  }
  h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  .subtitle{
    color:var(--muted);
    font-size:13px;
    margin-bottom:26px;
    text-transform:uppercase;
    letter-spacing:2px;
  }
  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
    font-size:13px;
    color:var(--muted);
  }
  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#666;
  }
  .dot.live{
    background:#3ddc84;
    box-shadow:0 0 8px #3ddc84;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
  }
  .now-playing{
    background:rgba(0,0,0,0.25);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:26px;
    min-height:54px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .np-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--accent2);
    margin-bottom:6px;
  }
  .np-title{
    font-size:16px;
    font-weight:600;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .np-listeners{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:22px;
  }
  .play-btn{
    width:68px;
    height:68px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;
    font-size:26px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(255,95,109,0.4);
    transition:transform 0.15s ease;
  }
  .play-btn:hover{transform:scale(1.06);}
  .play-btn:active{transform:scale(0.96);}
  .volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
  }
  .volume-row input[type="range"]{
    width:140px;
    accent-color:var(--accent);
  }
  .vol-icon{font-size:16px; color:var(--muted);}
  .footer-note{
    margin-top:20px;
    font-size:11px;
    color:var(--muted);
    opacity:0.7;
  }
</style>
</head>
<body>

<div class="player-card">
  <div class="logo-ring" id="logoRing">
    <div class="logo-inner">📻</div>
  </div>

  <h1>Konstantinos Radio</h1>
  <div class="subtitle">Live Streaming</div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Σύνδεση...</span>
  </div>

  <div class="now-playing">
    <div class="np-label">Παίζει τώρα</div>
    <div class="np-title" id="npTitle">—</div>
    <div class="np-listeners" id="npListeners"></div>
  </div>

  <div class="controls">
    <button class="play-btn" id="playBtn" aria-label="Play/Pause">▶</button>
  </div>

  <div class="volume-row">
    <span class="vol-icon">🔉</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="80">
    <span class="vol-icon">🔊</span>
  </div>

  <div class="footer-note">Konstantinos Radio</div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
(function(){
  // ====== ΡΥΘΜΙΣΕΙΣ ======
  const STREAM_URL = "https://uk22freenew.listen2myradio.com/live.mp3?typeportmount=s1_36462_stream_120761010";
  const SHOUTCAST_HOST = "uk22freenew.listen2myradio.com";
  const SHOUTCAST_PORT = "36462";

  // Πιθανά endpoints για metadata (Shoutcast v1 / v2)
  const STATS_URLS = [
    `http://${SHOUTCAST_HOST}:${SHOUTCAST_PORT}/stats?json=1`,
    `http://${SHOUTCAST_HOST}:${SHOUTCAST_PORT}/stats`,
    `http://${SHOUTCAST_HOST}:${SHOUTCAST_PORT}/7.html`
  ];

  // CORS proxy γιατί ο browser μπλοκάρει http-πρόσβαση/cross-origin σε stats endpoint
  const CORS_PROXY = "https://corsproxy.io/?url=";

  const audio = document.getElementById('audioPlayer');
  const playBtn = document.getElementById('playBtn');
  const logoRing = document.getElementById('logoRing');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const npTitle = document.getElementById('npTitle');
  const npListeners = document.getElementById('npListeners');
  const volumeSlider = document.getElementById('volumeSlider');

  let isPlaying = false;
  audio.volume = 0.8;

  // ---- Play / Pause ----
  playBtn.addEventListener('click', function(){
    if(!isPlaying){
      audio.src = STREAM_URL + (STREAM_URL.includes('?') ? '&' : '?') + '_=' + Date.now(); // avoid caching
      audio.play().then(()=>{
        isPlaying = true;
        playBtn.textContent = '❚❚';
        logoRing.classList.add('playing');
        statusText.textContent = 'Live';
      }).catch(err=>{
        statusText.textContent = 'Σφάλμα αναπαραγωγής';
        console.error(err);
      });
    } else {
      audio.pause();
      audio.src = '';
      isPlaying = false;
      playBtn.textContent = '▶';
      logoRing.classList.remove('playing');
      statusText.textContent = 'Παύση';
    }
  });

  volumeSlider.addEventListener('input', function(){
    audio.volume = volumeSlider.value / 100;
  });

  audio.addEventListener('waiting', ()=>{ statusText.textContent = 'Φόρτωση...'; });
  audio.addEventListener('playing', ()=>{ statusText.textContent = 'Live'; statusDot.classList.add('live'); });
  audio.addEventListener('error', ()=>{ statusText.textContent = 'Πρόβλημα σύνδεσης'; statusDot.classList.remove('live'); });

  // ---- Metadata polling ----
  async function fetchMetadata(){
    for(const rawUrl of STATS_URLS){
      const url = CORS_PROXY + encodeURIComponent(rawUrl);
      try{
        const res = await fetch(url, {cache:'no-store'});
        if(!res.ok) continue;
        const text = await res.text();

        // Προσπάθεια JSON parse (Shoutcast v2 json=1)
        try{
          const data = JSON.parse(text);
          const title = data.songtitle || data.SONGTITLE || data.servertitle || null;
          const listeners = data.currentlisteners ?? data.CURRENTLISTENERS ?? null;
          if(title){
            updateNowPlaying(title, listeners);
            statusDot.classList.add('live');
            return;
          }
        }catch(e){
          // Όχι JSON -> δοκιμή parsing σαν 7.html (comma separated) ή HTML stats page
          if(text.includes(',')){
            // 7.html format: streamstatus,bitrate,peaklisteners,currentlisteners,streamhits,songtitle...
            const parts = text.split(',');
            if(parts.length >= 7){
              const title = parts.slice(6).join(',').trim();
              const listeners = parts[3];
              if(title){
                updateNowPlaying(title, listeners);
                statusDot.classList.add('live');
                return;
              }
            }
          }
          // Προσπάθεια εξαγωγής από HTML stats page (SONGTITLE ή STREAMTITLE)
          const match = text.match(/STREAMTITLE=([^;]+);|SONGTITLE\s*[:=]\s*([^\n<]+)/i);
          if(match){
            const title = (match[1] || match[2] || '').trim();
            if(title){
              updateNowPlaying(title, null);
              statusDot.classList.add('live');
              return;
            }
          }
        }
      }catch(err){
        // δοκίμασε το επόμενο URL
        continue;
      }
    }
    // Αν τίποτα δεν δούλεψε
    npTitle.textContent = 'Μη διαθέσιμο αυτή τη στιγμή';
  }

  function updateNowPlaying(title, listeners){
    npTitle.textContent = title || '—';
    npTitle.title = title || '';
    if(listeners !== null && listeners !== undefined && listeners !== ''){
      npListeners.textContent = `👥 ${listeners} ακροατές`;
    } else {
      npListeners.textContent = '';
    }
  }

  fetchMetadata();
  setInterval(fetchMetadata, 15000); // ανανέωση κάθε 15 δευτερόλεπτα
})();
</script>

</body>
</html>
